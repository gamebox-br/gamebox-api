spring.application.name=gamebox-api

# ===== Banco de dados =====
# Os valores depois dos ":" são os padrões para rodar localmente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gamebox}
spring.datasource.username=${DB_USER:gamebox}
spring.datasource.password=${DB_PASSWORD:gamebox123}

# ===== JPA =====
# Quem cria as tabelas é o Flyway; o JPA só confere se batem com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration